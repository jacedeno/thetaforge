[project]
name = "thetaforge"
version = "0.1.0"
description = "Autonomous AI trading agent: ML momentum signals expressed through defined-risk options structures on Alpaca"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.33",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
